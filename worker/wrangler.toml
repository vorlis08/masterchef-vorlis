name = "vorlis"
main = "src/index.js"
compatibility_date = "2026-08-18"

# Nahledove adresy vypnute - Worker ma jen jednu verejnou adresu.
# POZOR: v TOML musi tenhle radek zustat NAD bloky [[...]], jinak spadne
# dovnitr posledniho bloku a tise se neuplatni.
preview_urls = false

# Client ID od Googlu je verejny udaj - vidi ho kazdy v adrese pri
# prihlasovani, takze klidne muze byt v repu.
[vars]
GOOGLE_CLIENT_ID = "947951400010-qfu21j9g331jd8t9imcaeolrphslhtkb.apps.googleusercontent.com"
# Adresa, ze ktere chodi uvitaci e-mail. Musi byt overena v Brevu.
MAIL_FROM = "honzavorel0@gmail.com"

# Tyhle DVA naopak nikdy nepatri sem, nastavuji se jako secret:
#   npx.cmd wrangler secret put ANTHROPIC_API_KEY
#   npx.cmd wrangler secret put GOOGLE_CLIENT_SECRET
#   npx.cmd wrangler secret put SESSION_SECRET

# Strop na pocet dotazu: 20 za minutu z jedne IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Databaze (D1). Schema je ve slozce migrations/.
[[d1_databases]]
binding = "DB"
database_name = "masterchef"
database_id = "d4df6301-4557-4c28-afed-3511eaf71561"
migrations_dir = "migrations"
