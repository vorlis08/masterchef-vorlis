name = "vorlis"
main = "src/index.js"
compatibility_date = "2026-08-18"

# Strop na pocet dotazu: 20 za minutu z jedne IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# ANTHROPIC_API_KEY se nastavuje jako secret, nikdy nepatri sem:
#   npx.cmd wrangler secret put ANTHROPIC_API_KEY

# Nahledove adresy vypnute - Worker ma jen jednu verejnou adresu.
preview_urls = false
